# An InferenceCluster backed by an EKS cluster.
#
# The EKS cluster provider provisions the full EKS cluster (VPC, subnets,
# internet gateway, IAM roles for the cluster and nodes, system + GPU node
# groups, vpc-cni / kube-proxy / coredns addons) from the EKSClusterConfig
# the InferenceCluster names, and Modelplane installs the inference stack
# (cert-manager, Envoy Gateway, LeaderWorkerSet, Gateway API).
#
# The system node group that hosts control-plane components is
# provisioned automatically and is not declared here. Only GPU node
# groups - each referencing an InferenceClass that describes the
# hardware shape and names the node class to provision it from - need to
# be declared.
#
# The provider provisions EFS RWX storage for ModelCache on EKS: an
# Elastic-throughput file system, mount targets, the EFS CSI driver, and
# a 'modelplane-rwx-efs' StorageClass pinned to it. The admin does
# nothing, and provisioned EKS clusters take no StorageClass override.
#
# Delete what runs on this InferenceCluster first, since it refuses deletion
# while anything uses it, then delete it with foreground cascading deletion
# for a clean teardown:
#
#   kubectl delete inferencecluster eks-us-west --cascade=foreground
#
# The inference stack runs on the EKS cluster and must uninstall while
# the cluster's API server and kubeconfig still exist - otherwise its
# Helm releases hang, and a load balancer one of them created can leak
# its security group and block the VPC from deleting. Foreground
# deletion holds the cluster until the stack is uninstalled. Background
# deletion (the kubectl default) tears everything down at once and can
# orphan cloud resources.
apiVersion: eks.modelplane.ai/v1alpha1
kind: EKSClusterConfig
metadata:
  name: us-west-2
spec:
  region: us-west-2
  # The AWS ClusterProviderConfig that provisions the cluster. Modelplane
  # also authenticates to the cluster as its principal. This is the
  # default, so it can be omitted.
  credentials:
    type: ClusterProviderConfig
    name: default
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: eks-us-west
  labels:
    modelplane.ai/region: us-west
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: eks.modelplane.ai/v1alpha1
        kind: EKSClusterConfig
        name: us-west-2

  nodePools:
  - name: gpu-l4
    className: eks-l4-1x-g6
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 4
    zones:
    - us-west-2a
    - us-west-2b
