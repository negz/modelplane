# An InferenceClass describing AKS Standard_ND96isr_H100_v5 with 8x
# NVIDIA H100.
#
# The nodeClassRef names an AKSNodeClass, which says how to create a node
# pool of this class on AKS. The AKS cluster provider adds the
# AKSNodeClass kind. Azure sizes nodes by VM size, which determines the
# GPU model and count. The devices block describes what hardware a node
# of this class has, DRA-style - used by the scheduler to match models to
# clusters, and to form DRA ResourceClaims for claim: DRA devices.
apiVersion: aks.modelplane.ai/v1alpha1
kind: AKSNodeClass
metadata:
  name: standard-nd96isr-h100-v5-200gb
spec:
  vmSize: Standard_ND96isr_H100_v5
  diskSizeGb: 200
  accelerator:
    type: nvidia-h100
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: aks-h100-8x
spec:
  description: "AKS Standard_ND96isr_H100_v5, 8x NVIDIA H100 80GB"
  nodeClassRef:
    apiVersion: aks.modelplane.ai/v1alpha1
    kind: AKSNodeClass
    name: standard-nd96isr-h100-v5-200gb
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 8
    attributes:
      architecture: { string: Hopper }
      cudaComputeCapability: { version: "9.0.0" }
    capacity:
      # The H100 80GB's real usable VRAM, what the NVIDIA DRA driver reports,
      # not its nominal 80GB. A nodeSelector asking for >= 80Gi would never bind.
      memory: { value: "81559Mi" }
