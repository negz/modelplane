# A GKE InferenceCluster whose L4 pool consumes a Compute Engine reservation.
# The pool is restricted to the reservation's zone.
apiVersion: gke.modelplane.ai/v1alpha1
kind: GKECapacityReservation
metadata:
  name: l4-reservation
spec:
  zone: us-central1-a
  name: l4-reservation
  # project: shared-reservations  # for a reservation shared from another project
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: gke-reserved
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: gke.modelplane.ai/v1alpha1
        kind: GKEClusterConfig
        name: us-central1
  nodePools:
  - name: l4-pool
    className: gke-l4-1x-g2
    nodeCount: 2
    maxNodeCount: 2
    zones: [us-central1-a]
    reservationRef:
      apiVersion: gke.modelplane.ai/v1alpha1
      kind: GKECapacityReservation
      name: l4-reservation
