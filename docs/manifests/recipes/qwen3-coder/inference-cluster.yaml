# An EKS InferenceCluster with a two-node H200 pool over EFA, validated serving
# Qwen3-Coder-480B as a multi-node gang. The H200 nodes come from an EC2
# Capacity Block reserved for ML, registered as an EKSCapacityReservation that
# the pool references. EFA comes from the class's node class.
apiVersion: eks.modelplane.ai/v1alpha1
kind: EKSCapacityReservation
metadata:
  name: h200-capacity-block
spec:
  region: us-east-2
  type: CapacityBlock
  id: cr-0123456789abcdef0  # replace with your reservation ID
---
apiVersion: eks.modelplane.ai/v1alpha1
kind: EKSClusterConfig
metadata:
  name: us-east-2
spec:
  region: us-east-2
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: eks-coder
  labels:
    modelplane.ai/region: us
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: eks.modelplane.ai/v1alpha1
        kind: EKSClusterConfig
        name: us-east-2
  nodePools:
  - name: gpu-h200
    className: eks-h200-8x-p5en
    nodeCount: 2
    minNodeCount: 2
    maxNodeCount: 2
    zones:
    - us-east-2b  # the Capacity Block's Availability Zone
    reservationRef:
      apiVersion: eks.modelplane.ai/v1alpha1
      kind: EKSCapacityReservation
      name: h200-capacity-block
