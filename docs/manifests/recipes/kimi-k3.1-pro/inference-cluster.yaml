# EKS InferenceCluster with one 8x B300 node. p6-b300.48xlarge capacity is
# scarce on demand. To use an EC2 Capacity Block, register it as an
# EKSCapacityReservation and set the pool's reservationRef, as
# qwen3-coder/inference-cluster.yaml does.
apiVersion: eks.modelplane.ai/v1alpha1
kind: EKSClusterConfig
metadata:
  name: us-west-2
spec:
  region: us-west-2
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: eks-b300
  labels:
    modelplane.ai/cloud: eks
    modelplane.ai/region: us-west
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: eks.modelplane.ai/v1alpha1
        kind: EKSClusterConfig
        name: us-west-2
  nodePools:
  - name: gpu-b300-8x
    className: eks-b300-8x-p6
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 1
