apiVersion: gke.modelplane.ai/v1alpha1
kind: GKENodeClass
metadata:
  name: a2-highgpu-1g-a100-200gb
spec:
  machineType: a2-highgpu-1g
  diskSizeGb: 200
  accelerator:
    type: nvidia-tesla-a100
    count: 1
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: gke-a100-40-1x
spec:
  description: "GKE a2-highgpu-1g, 1x NVIDIA A100 40GB"
  nodeClassRef:
    apiVersion: gke.modelplane.ai/v1alpha1
    kind: GKENodeClass
    name: a2-highgpu-1g-a100-200gb
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 1
    attributes:
      architecture: { string: Ampere }
      cudaComputeCapability: { version: "8.0.0" }
    capacity:
      # A100 40GB real reported VRAM. Keep the selector at >= 35Gi (not >= 40Gi)
      # so it reliably clears the L4 (24Gi) without hitting the boundary.
      memory: { value: "40960Mi" }
---
apiVersion: gke.modelplane.ai/v1alpha1
kind: GKEClusterConfig
metadata:
  name: us-west1
spec:
  region: us-west1
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: gke-us-west
  labels:
    modelplane.ai/region: us-west
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: gke.modelplane.ai/v1alpha1
        kind: GKEClusterConfig
        name: us-west1
  nodePools:
  - name: gpu-a100
    className: gke-a100-40-1x
    nodeCount: 1
    minNodeCount: 0
    maxNodeCount: 2
    zones:
    - us-west1-b
---
apiVersion: gke.modelplane.ai/v1alpha1
kind: GKEClusterConfig
metadata:
  name: us-east1
spec:
  region: us-east1
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: gke-us-east
  labels:
    modelplane.ai/region: us-east
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: gke.modelplane.ai/v1alpha1
        kind: GKEClusterConfig
        name: us-east1
  nodePools:
  - name: gpu-a100
    className: gke-a100-40-1x
    nodeCount: 1
    minNodeCount: 0
    maxNodeCount: 2
    zones:
    - us-east1-b
