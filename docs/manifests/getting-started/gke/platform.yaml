apiVersion: gke.modelplane.ai/v1alpha1
kind: GKENodeClass
metadata:
  name: g2-standard-8-l4
spec:
  machineType: g2-standard-8
  diskSizeGb: 100
  accelerator:
    type: nvidia-l4
    count: 1
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: gke-l4-1x-g2
spec:
  description: "GKE g2-standard-8, 1x NVIDIA L4"
  nodeClassRef:
    apiVersion: gke.modelplane.ai/v1alpha1
    kind: GKENodeClass
    name: g2-standard-8-l4
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 1
    attributes:
      architecture: { string: Ada Lovelace }
    capacity:
      memory: { value: "23034Mi" }   # L4's real reported VRAM (not the nominal 24GB)
---
apiVersion: gke.modelplane.ai/v1alpha1
kind: GKEClusterConfig
metadata:
  name: us-central1
spec:
  region: us-central1
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: gke-us-central
  labels:
    modelplane.ai/region: us-central
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: gke.modelplane.ai/v1alpha1
        kind: GKEClusterConfig
        name: us-central1
  nodePools:
  - name: gpu-l4
    className: gke-l4-1x-g2
    nodeCount: 1
    minNodeCount: 0
    maxNodeCount: 2
    zones:
    - us-central1-a
