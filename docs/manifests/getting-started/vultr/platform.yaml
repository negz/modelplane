apiVersion: vultr.modelplane.ai/v1alpha1
kind: VultrNodeClass
metadata:
  name: vcg-a16-6c-60g-16vram
spec:
  plan: vcg-a16-6c-60g-16vram
  accelerator:
    type: nvidia-a16
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: a16-1x
spec:
  # Vultr GPU plans are region-gated and the catalog changes; list what a
  # region offers with the /v2/regions/<region>/availability API before
  # picking another plan.
  description: "Vultr vcg-a16-6c-60g-16vram, 1x NVIDIA A16 16GB"
  nodeClassRef:
    apiVersion: vultr.modelplane.ai/v1alpha1
    kind: VultrNodeClass
    name: vcg-a16-6c-60g-16vram
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 1
    attributes:
      architecture: { string: Ampere }
      cudaComputeCapability: { version: "8.6.0" }
    capacity:
      memory: { value: "16384Mi" }
---
apiVersion: vultr.modelplane.ai/v1alpha1
kind: VultrClusterConfig
metadata:
  name: ewr
spec:
  region: ewr
  # VKE accepts only the exact versions it currently offers; list them
  # with vultr-cli kubernetes versions.
  kubernetesVersion: "v1.36.6+1"
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: vultr-ewr
  labels:
    modelplane.ai/region: ewr
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: vultr.modelplane.ai/v1alpha1
        kind: VultrClusterConfig
        name: ewr
  nodePools:
  - name: gpu-a16
    className: a16-1x
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 1
