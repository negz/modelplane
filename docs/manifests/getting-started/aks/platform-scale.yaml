apiVersion: aks.modelplane.ai/v1alpha1
kind: AKSNodeClass
metadata:
  name: standard-nc24ads-a100-v4
spec:
  vmSize: Standard_NC24ads_A100_v4
  diskSizeGb: 100
  accelerator:
    type: nvidia-a100
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: a100-1x
spec:
  description: "AKS Standard_NC24ads_A100_v4, 1x NVIDIA A100 80GB"
  nodeClassRef:
    apiVersion: aks.modelplane.ai/v1alpha1
    kind: AKSNodeClass
    name: standard-nc24ads-a100-v4
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 1
    attributes:
      architecture: { string: Ampere }
      cudaComputeCapability: { version: "8.0.0" }
    capacity:
      memory: { value: "81920Mi" }
---
# verify: Standard_NC24ads_A100_v4 quota/availability in eastus and southcentralus.
apiVersion: aks.modelplane.ai/v1alpha1
kind: AKSClusterConfig
metadata:
  name: eastus
spec:
  location: eastus
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: aks-eastus
  labels:
    modelplane.ai/region: eastus
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: aks.modelplane.ai/v1alpha1
        kind: AKSClusterConfig
        name: eastus
  nodePools:
  - name: gpua100
    className: a100-1x
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 1
---
apiVersion: aks.modelplane.ai/v1alpha1
kind: AKSClusterConfig
metadata:
  name: southcentralus
spec:
  location: southcentralus
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: aks-southcentralus
  labels:
    modelplane.ai/region: southcentralus
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: aks.modelplane.ai/v1alpha1
        kind: AKSClusterConfig
        name: southcentralus
  nodePools:
  - name: gpua100
    className: a100-1x
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 1
