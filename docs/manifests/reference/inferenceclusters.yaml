apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: west-gke
spec:
  cluster:
    source: Provisioned
    provisioned:
      configRef:
        apiVersion: gke.modelplane.ai/v1alpha1
        kind: GKEClusterConfig
        name: us-central1
  nodePools:
    - name: l4-pool
      className: gke-l4-1x-g2
      nodeCount: 2
      maxNodeCount: 10
      zones: [us-central1-a]
