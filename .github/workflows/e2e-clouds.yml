name: E2E Clouds

# The cluster provider conformance suite: every provider's device stack, and
# Existing's, on the two-cluster setup from e2e/, with KWOK faking that cloud's
# tainted device pools, and each provider's ProvisionedCluster Composition (see
# e2e/clouds/). Catches toleration, placement and contract regressions from
# stack regenerations and provider edits without cloud credentials. Triggered
# by the paths such regressions come from - `nix run .#stacks`, toleration
# edits, providers, the contract, and the harness itself - rather than the
# model e2e's test-e2e label: most PRs touching the stack never got the label,
# while most labelled PRs don't touch the stack and would pay nine ~25 minute
# jobs per push for nothing.
on:
  pull_request:
    paths:
      - functions/compose-serving-stack/**
      - functions/compose-inference-cluster/**
      - apis/**
      - sdk/**
      - providers/**
      - e2e/**
      - flake.nix
      - nix/**
      - .github/workflows/e2e-clouds.yml
  workflow_dispatch: {}

# Cancel in-progress runs for the same PR. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The legs: Existing's two, and one per provider under providers/.
  legs:
    runs-on: ubuntu-24.04
    outputs:
      clouds: ${{ steps.legs.outputs.clouds }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: List legs
        id: legs
        run: |
          providers=$(find providers -mindepth 1 -maxdepth 1 -type d -printf '"%f",')
          echo "clouds=[${providers}\"existing\",\"existing-filtered\"]" >> "$GITHUB_OUTPUT"

  e2e-clouds:
    needs: legs
    runs-on: ubuntu-24.04
    # Generous: a cold Nix cache (the Actions cache throttles) rebuilds the
    # function images, on top of the two-cluster bring-up and serving-stack
    # install.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.legs.outputs.clouds) }}

    steps:
      # Two kind clusters and the serving stack need more disk than the runner
      # has free by default, the same reason the push-package job reclaims space.
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: false
          large-packages: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: log-lines = 500

      # See ci.yml for why use-flakehub is off.
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      # A provider's build reads Modelplane's package from a registry, so push
      # this tree's to a local one. Building the provider here also proves it
      # builds against it.
      - name: Build provider
        if: ${{ !startsWith(matrix.cloud, 'existing') }}
        run: nix run .#build-${{ matrix.cloud }} --print-build-logs

      # Brings the environment up as this cloud's leg, applies the fake GPU
      # nodes, the ServingStack, and the provider's device stack and
      # provisioning objects, and runs the tests in e2e/clouds/ - the Ready
      # wait, DaemonSet fan-out, the placement and toleration audits, and the
      # provisioning contract. The exact command a developer runs locally.
      - name: Run e2e
        run: nix run .#e2e --print-build-logs -- --cloud ${{ matrix.cloud }}

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-logs
          nix develop --command bash -c '
            kind export logs e2e-logs/control-plane --name modelplane-e2e-local || true
            kind export logs e2e-logs/workload --name modelplane-e2e-workload || true
            kubectl --context kind-modelplane-e2e-local -n modelplane-system get servingstack -o yaml > e2e-logs/servingstack.yaml 2>&1 || true
            kubectl --context kind-modelplane-e2e-local get releases.helm.m.crossplane.io,objects.kubernetes.m.crossplane.io -A > e2e-logs/composed.txt 2>&1 || true
            kubectl --context kind-modelplane-e2e-workload get nodes,pods -A -o wide > e2e-logs/workload-placement.txt 2>&1 || true
          '

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-clouds-${{ matrix.cloud }}-diagnostics
          path: e2e-logs
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: nix run .#e2e -- --clean
