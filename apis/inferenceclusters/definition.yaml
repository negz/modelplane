apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: inferenceclusters.modelplane.ai
spec:
  group: modelplane.ai
  names:
    categories: [crossplane, modelplane, platform]
    kind: InferenceCluster
    plural: inferenceclusters
    shortNames: [ic]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: SOURCE
      type: string
      jsonPath: .spec.cluster.source
    - name: CONFIG
      type: string
      jsonPath: .spec.cluster.provisioned.configRef.kind
    - name: GATEWAY
      type: string
      jsonPath: .status.gateway.address
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [cluster]
            x-kubernetes-validations:
            - rule: "self.cluster.source == 'Provisioned' || !has(self.nodePools) || self.nodePools.all(p, !has(p.reservationRef))"
              message: nodePools[].reservationRef is only supported when cluster.source is Provisioned.
            - rule: "self.cluster.source != 'Provisioned' || has(self.nodePools)"
              message: spec.nodePools is required when cluster.source is Provisioned.
            properties:
              cluster:
                type: object
                required: [source]
                x-kubernetes-validations:
                - rule: "self.source != 'Existing' || has(self.existing)"
                  message: spec.cluster.existing is required when spec.cluster.source is Existing.
                - rule: "self.source != 'Provisioned' || has(self.provisioned)"
                  message: spec.cluster.provisioned is required when spec.cluster.source is Provisioned.
                properties:
                  source:
                    type: string
                    description: >-
                      How Modelplane gets the cluster. Existing registers a
                      cluster you already run. Provisioned has a cluster
                      provider create it, from the cluster config
                      provisioned.configRef names. Immutable: changing it
                      would delete a provisioned cluster.
                    enum: [Existing, Provisioned]
                    x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.cluster.source is immutable; create a new InferenceCluster instead.
                  existing:
                    type: object
                    description: >-
                      Bring-your-own cluster configuration. Required when
                      source is Existing. Modelplane manages the inference
                      stack on the cluster but does not provision the
                      cluster itself.
                    required: [secretRef]
                    properties:
                      secretRef:
                        type: object
                        description: >-
                          Reference to a Secret containing a kubeconfig
                          for the existing cluster. The Secret must exist
                          in the modelplane-system namespace.
                        required: [name]
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                          key:
                            type: string
                            default: kubeconfig
                            minLength: 1
                            maxLength: 253
                      identitySecretRef:
                        type: object
                        description: >-
                          Optional reference to a Secret containing cloud
                          provider credentials for IAM-based authentication.
                          The type selects which cloud identity the
                          ProviderConfigs authenticate as, and must match the
                          cloud the existing cluster runs on.
                        required: [name]
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                          key:
                            type: string
                            default: private_key
                            minLength: 1
                            maxLength: 253
                          type:
                            type: string
                            description: >-
                              Cloud identity type the credential authenticates
                              as. Must match the cloud the existing cluster runs
                              on. Defaults to GoogleApplicationCredentials.
                            default: GoogleApplicationCredentials
                            enum:
                            - GoogleApplicationCredentials
                            - AWSWebIdentityCredentials
                            - NebiusServiceAccountCredentials
                      cache:
                        type: object
                        description: >-
                          ModelCache configuration for this cluster.
                        properties:
                          storageClassName:
                            type: string
                            description: >-
                              Name of an existing ReadWriteMany StorageClass
                              for ModelCache PVCs. Modelplane doesn't provision
                              storage on an existing cluster, so the admin must
                              create the StorageClass (it must support
                              ReadWriteMany dynamic provisioning).
                            minLength: 1
                            maxLength: 253
                  provisioned:
                    type: object
                    description: >-
                      How to provision the cluster. Required when source is
                      Provisioned.
                    required: [configRef]
                    properties:
                      configRef:
                        type: object
                        description: >-
                          The cluster config to provision the cluster from,
                          such as a GKEClusterConfig. Its kind selects the
                          cluster provider, which must be installed. A config
                          holds what a provider needs beyond the node pools,
                          like the region and credentials, and several
                          clusters can share one. The kind can't change; to
                          move a cluster to another provider, create a new
                          InferenceCluster.
                        required: [apiVersion, kind, name]
                        x-kubernetes-validations:
                        - rule: "self.kind == oldSelf.kind && self.apiVersion.split('/')[0] == oldSelf.apiVersion.split('/')[0]"
                          message: The kind and API group of spec.cluster.provisioned.configRef are immutable.
                        properties:
                          apiVersion:
                            type: string
                            description: >-
                              The kind's API group and version, such as
                              example.modelplane.ai/v1alpha1.
                            pattern: '^[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?/v[a-z0-9]+$'
                            maxLength: 80
                          kind:
                            type: string
                            minLength: 1
                            maxLength: 63
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
              stack:
                type: string
                default: Standard
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: spec.stack is immutable; recreate the cluster to change its serving stack.
                description: >-
                  Which serving stack the cluster installs and composes. Standard
                  (the default) is the Modelplane-composed serving layer: a
                  Deployment or LeaderWorkerSet, Gateway API, and the endpoint
                  picker. Dynamo swaps in NVIDIA's components: Grove with the KAI
                  Scheduler gang-schedules multi-node engines, and ModelExpress
                  distributes weights. A single-node (Standalone) engine's
                  workload kind is unaffected - it stays a Deployment - but if it
                  references a ModelCache on a Dynamo cluster it still gets the
                  ModelExpress P2P env and IPC_LOCK, so it can seed peers and
                  load from them like a gang.
                enum:
                - Standard
                - Dynamo
              placement:
                type: object
                description: >-
                  Facts about where this cluster is, projected onto everything
                  Modelplane composes here.
                properties:
                  metadata:
                    type: object
                    description: Metadata to project.
                    properties:
                      labels:
                        type: object
                        description: >-
                          Labels stamped onto every ModelReplica and
                          ModelEndpoint composed on this cluster.

                          This is how a self-hosted endpoint gets its region: a
                          ModelService selects endpoints by label, so a service
                          scoped to a region selects only the endpoints in it.
                          These are your labels, under your own prefix.
                        additionalProperties:
                          type: string
                          maxLength: 63
                        maxProperties: 16
                        x-kubernetes-validations:
                        - rule: "self.all(k, !k.startsWith('modelplane.ai/'))"
                          message: spec.placement.metadata.labels must not use the reserved modelplane.ai/ prefix.
              taints:
                type: array
                description: >-
                  Taints that repel ModelDeployments from this cluster unless
                  they carry a matching toleration, following the Kubernetes
                  taint model. NoSchedule keeps new replicas off the cluster
                  while leaving existing ones in place; NoExecute additionally
                  drains the replicas already here, which the scheduler
                  reschedules onto other tolerated clusters (the declarative
                  equivalent of draining a node before maintenance).
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [key, effect]
                items:
                  type: object
                  required: [key, effect]
                  properties:
                    key:
                      type: string
                      minLength: 1
                    value:
                      type: string
                    effect:
                      type: string
                      enum: [NoSchedule, NoExecute]
              nodePools:
                type: array
                description: >-
                  Inference node pools available on this cluster. Each pool
                  references an InferenceClass that describes the
                  hardware shape and, for a provisioned cluster, the node
                  class to create the pool from. A provisioned cluster also
                  gets a system pool for Modelplane's own components.
                minItems: 1
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name, className]
                  x-kubernetes-validations:
                  - rule: "has(self.reservationRef) == has(oldSelf.reservationRef) && (!has(self.reservationRef) || self.reservationRef == oldSelf.reservationRef)"
                    message: A node pool's reservationRef is immutable. Add a new pool instead.
                  properties:
                    name:
                      type: string
                      maxLength: 40
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: >-
                        Name of the pool. Its nodes carry it as the value of
                        the modelplane.ai/pool label, and the cluster agent
                        observes the pool through an object of this name.
                    className:
                      type: string
                      description: >-
                        Name of the InferenceClass describing this pool's
                        hardware.
                      minLength: 1
                      maxLength: 253
                    nodeCount:
                      type: integer
                      default: 1
                      minimum: 0
                      maximum: 1000
                    minNodeCount:
                      type: integer
                      minimum: 0
                      maximum: 1000
                    maxNodeCount:
                      type: integer
                      description: >-
                        Maximum node count for autoscaling. Omit for
                        fixed-size pools.
                      minimum: 1
                      maximum: 1000
                    zones:
                      type: array
                      description: >-
                        Zones to restrict this node pool to, because not
                        every zone in a region has every GPU type. Only on a
                        provisioned cluster whose provider supports zones.
                      maxItems: 16
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        minLength: 1
                        maxLength: 63
                    reservationRef:
                      type: object
                      description: >-
                        The capacity reservation backing this node pool, such
                        as a GKECapacityReservation. The pool only uses the
                        referenced reservation, and never falls back to
                        on-demand capacity, so nodeCount must not exceed the
                        reserved instance count. The reservation must be one
                        the cluster's provider owns, and the provider must
                        support reservations. Immutable, because a cloud can't
                        move an existing node pool onto or off a reservation.
                        Omit for on-demand pools.
                      required: [apiVersion, kind, name]
                      properties:
                        apiVersion:
                          type: string
                          description: >-
                            The kind's API group and version, such as
                            example.modelplane.ai/v1alpha1.
                          pattern: '^[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?/v[a-z0-9]+$'
                          maxLength: 80
                        kind:
                          type: string
                          minLength: 1
                          maxLength: 63
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
          status:
            type: object
            properties:
              providerConfigRef:
                type: object
                properties:
                  name:
                    type: string
                    description: >-
                      Name of the ProviderConfig targeting the remote cluster.
                      Used by ModelReplica to create resources on the cluster.
              gateway:
                type: object
                description: >-
                  This cluster's own gateway: the Envoy gateway the serving stack
                  runs at the cluster's edge, which an InferenceGateway routes to.
                  These fields are how an InferenceGateway reaches it.
                properties:
                  address:
                    type: string
                    description: >-
                      The gateway's external address, an IP or a load balancer's
                      own DNS name.
                  hostname:
                    type: string
                    description: >-
                      The stable internal name an InferenceGateway addresses the
                      gateway by, derived by Modelplane. Each InferenceGateway
                      resolves it to address with a Service on its own cluster; it
                      is also the gateway's TLS SNI and certificate SAN.
                      ModelDeployment builds a ModelEndpoint origin from it. Set
                      once the gateway has an address and both directions are
                      mutually authenticated, and withheld otherwise.
                  caCertificate:
                    type: string
                    maxLength: 16384
                    description: >-
                      PEM certificate of the CA that signed the gateway's serving
                      certificate. An InferenceGateway validates the gateway's
                      serving certificate against it. Written once cert-manager on
                      the cluster has issued.
              cache:
                type: object
                description: >-
                  Observed ModelCache RWX storage state.
                properties:
                  storageClassName:
                    type: string
                    description: >-
                      Effective ReadWriteMany StorageClass name for ModelCache
                      PVCs on this cluster. ModelCache reads this to target
                      the cache PVC.
                    maxLength: 253
              schedulablePools:
                type: array
                description: >-
                  Schedulable node pools on this cluster - GPU and CPU alike;
                  every pool whose class declares devices - derived from the
                  referenced classes, the per-pool node counts, and what the
                  cluster agent observes of each pool. ModelDeployment
                  scheduling matches against these.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: >-
                        Node pool name, matching spec.nodePools[].name.
                        Used to pin a ModelReplica to a specific pool via
                        spec.nodePoolName.
                    nodes:
                      type: integer
                      description: >-
                        The most nodes this pool can have. Derived from
                        maxNodeCount (if autoscaling) or nodeCount.
                    observedNodes:
                      type: integer
                      minimum: 0
                      description: >-
                        The nodes this pool has now, ready or not, as the
                        cluster agent observes them. Absent until the agent
                        reports on the pool, and while it can't observe it.
                    lastAllocationTime:
                      type: string
                      format: date-time
                      description: >-
                        The latest time the cluster agent first saw a
                        ResourceClaim allocated devices on this pool's nodes.
                        nodesByFreeDevices accounts for the devices of a
                        ModelReplica whose lastAllocationTime for this pool is
                        no later than this. Published with observedNodes, once
                        a claim has allocated devices on the pool.
                    nodesByFreeDevices:
                      type: array
                      description: >-
                        A histogram of this pool's schedulable nodes by how
                        many devices of each DeviceClass are free on them, as
                        the cluster agent observes them. Nodes with the same
                        number of free devices of every class share a bucket.
                        Published with observedNodes.
                      maxItems: 256
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        required: [nodes]
                        properties:
                          freeDevices:
                            type: object
                            description: >-
                              Each node's free devices, keyed by DeviceClass.
                              A class the nodes publish no devices of is
                              absent.
                            maxProperties: 32
                            additionalProperties:
                              type: integer
                              minimum: 0
                          nodes:
                            type: integer
                            minimum: 1
                            description: Nodes with these free devices.
                    devices:
                      type: array
                      description: >-
                        Devices copied from the pool's InferenceClass.
                        ModelDeployment.nodeSelector matches against these.
                      maxItems: 16
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, driver]
                        properties:
                          name:
                            type: string
                            maxLength: 63
                          claim:
                            type: string
                            enum: [DRA, Synthetic]
                          driver:
                            type: string
                            maxLength: 253
                          deviceClassName:
                            type: string
                            maxLength: 253
                          count:
                            type: integer
                          attributes:
                            type: object
                            maxProperties: 32
                            additionalProperties:
                              type: object
                              properties:
                                string:
                                  type: string
                                  maxLength: 253
                                version:
                                  type: string
                                  maxLength: 32
                                bool:
                                  type: boolean
                                int:
                                  type: integer
                                  format: int64
                          capacity:
                            type: object
                            maxProperties: 32
                            additionalProperties:
                              type: object
                              required: [value]
                              properties:
                                value:
                                  type: string
                                  maxLength: 32
              namespace:
                type: string
                description: >-
                  Namespace where the internal XRs (cluster, backend) were created.
