# A pod to send requests to the gateways from. Their addresses are on the kind
# Docker network, which a macOS host can't route to but a pod can. The tests
# exec curl in it.
apiVersion: v1
kind: Namespace
metadata:
  name: bakeoff-pytest-client
---
apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: bakeoff-pytest-client
spec:
  containers:
  - name: curl
    # Pinned by digest (a multi-arch manifest list) so a moving tag can't flake
    # the tests.
    image: curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    command: ["sleep", "infinity"]
  # sleep ignores SIGTERM, so don't wait for it to exit.
  terminationGracePeriodSeconds: 0
