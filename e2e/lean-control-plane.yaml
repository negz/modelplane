# Replace the Helm chart's default catch-all MRAP (activate: ["*"]) with one
# that activates only provider-kubernetes and provider-helm, the managed
# resources Modelplane's own compositions use, as the install guide's empty
# default activation does.
#
# Bring-up feeds this via `crossplane project run --init-resources`, which
# applies it BEFORE the Configuration's dependencies install. On a provider's
# leg the provider's cloud providers then stay inactive, and since they
# declare the safe-start capability, Crossplane scales their controllers to
# zero, until the provider's ProvisionedCluster activates the kinds it
# composes. The compositions run provider-helm/kubernetes v2, whose MRs are
# namespaced (.m.crossplane.io) - the same forms the shipped apis/mrap.yaml
# activates - so the cluster-scoped variants aren't needed here.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: default
spec:
  activate:
  - "*.kubernetes.m.crossplane.io"
  - "*.helm.m.crossplane.io"
