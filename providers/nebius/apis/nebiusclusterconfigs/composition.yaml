apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: nebiusclusterconfigs.nebius.modelplane.ai
spec:
  compositeTypeRef:
    apiVersion: nebius.modelplane.ai/v1alpha1
    kind: NebiusClusterConfig
  mode: Pipeline
  # Nothing to compose: compose-provisioned-cluster reads it. The step exists
  # because an XR needs a Composition, and with nothing composed it's Ready.
  pipeline:
  - functionRef:
      name: modelplane-modelplane-nebiuscompose-provisioned-cluster
    step: compose-provisioned-cluster
