# Activates the managed resource kinds every Nebius cluster composes on itself,
# for its device stack and its ModelCache storage, so the provider works with
# Crossplane installed with an empty default activation
# (provider.defaultActivations=[]). compose-provisioned-cluster composes a
# second policy activating the Nebius kinds, so the Nebius provider runs only
# once a control plane has a Nebius cluster. Policies are additive, and their
# names global, so this one is named for its provider.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: modelplane-nebius
spec:
  activate:
  - releases.helm.m.crossplane.io
  - objects.kubernetes.m.crossplane.io
