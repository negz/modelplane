apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: coreweavenodeclasses.coreweave.modelplane.ai
spec:
  compositeTypeRef:
    apiVersion: coreweave.modelplane.ai/v1alpha1
    kind: CoreWeaveNodeClass
  mode: Pipeline
  # Nothing to compose: compose-provisioned-cluster reads it. The step exists
  # because an XR needs a Composition, and with nothing composed it's Ready.
  pipeline:
  - functionRef:
      name: modelplane-modelplane-coreweavecompose-provisioned-cluster
    step: compose-provisioned-cluster
