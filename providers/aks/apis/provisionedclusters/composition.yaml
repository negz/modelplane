apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  # Composition names are global, and every provider ships a Composition for
  # a ProvisionedCluster, so this one is named for its provider.
  name: aks.provisionedclusters.infrastructure.modelplane.ai
  labels:
    # compose-inference-cluster selects this Composition for an
    # InferenceCluster whose spec.cluster.provisioned.configRef is an
    # AKSClusterConfig.
    infrastructure.modelplane.ai/config-group: aks.modelplane.ai
    infrastructure.modelplane.ai/config-kind: AKSClusterConfig
  annotations:
    # The optional parts of the ProvisionedCluster contract this provider
    # implements. AKS pools can be restricted to Availability Zones. AKS has
    # no capacity reservations.
    infrastructure.modelplane.ai/capabilities: Zones
    # The DRA drivers whose device stacks the AKSDeviceStack installs.
    infrastructure.modelplane.ai/dra-drivers: gpu.nvidia.com
spec:
  compositeTypeRef:
    apiVersion: infrastructure.modelplane.ai/v1alpha1
    kind: ProvisionedCluster
  mode: Pipeline
  pipeline:
  - functionRef:
      name: modelplane-modelplane-akscompose-provisioned-cluster
    step: compose-provisioned-cluster
