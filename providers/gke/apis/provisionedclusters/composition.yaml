apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  # Composition names are global, and every provider ships a Composition for
  # a ProvisionedCluster, so this one is named for its provider.
  name: gke.provisionedclusters.infrastructure.modelplane.ai
  labels:
    # compose-inference-cluster selects this Composition for an
    # InferenceCluster whose spec.cluster.provisioned.configRef is a
    # GKEClusterConfig.
    infrastructure.modelplane.ai/config-group: gke.modelplane.ai
    infrastructure.modelplane.ai/config-kind: GKEClusterConfig
  annotations:
    # The optional parts of the ProvisionedCluster contract this provider
    # implements. A GKE pool can be restricted to some of its region's zones,
    # and backed by a GKECapacityReservation.
    infrastructure.modelplane.ai/capabilities: Zones,CapacityReservations
    # The DRA drivers whose device stacks the GKEDeviceStack installs.
    infrastructure.modelplane.ai/dra-drivers: gpu.nvidia.com
spec:
  compositeTypeRef:
    apiVersion: infrastructure.modelplane.ai/v1alpha1
    kind: ProvisionedCluster
  mode: Pipeline
  pipeline:
  - functionRef:
      name: modelplane-modelplane-gkecompose-provisioned-cluster
    step: compose-provisioned-cluster
