apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: civodevicestacks.civo.modelplane.ai
spec:
  group: civo.modelplane.ai
  names:
    categories: [crossplane, modelplane, civo]
    kind: CivoDeviceStack
    plural: civodevicestacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        description: >-
          A CivoDeviceStack installs the device stacks for the DRA drivers a
          Civo cluster's InferenceClasses claim. The cluster's
          ProvisionedCluster composes it once the cluster is reachable.
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [secrets]
            properties:
              secrets:
                type: array
                description: >-
                  Secrets used to authenticate to the cluster. A Kubeconfig
                  entry is required.
                minItems: 1
                maxItems: 8
                x-kubernetes-validations:
                - rule: "self.exists(s, s.type == 'Kubeconfig')"
                  message: secrets must include a Kubeconfig entry.
                items:
                  type: object
                  required: [type, name, key]
                  properties:
                    type:
                      type: string
                      minLength: 1
                      maxLength: 63
                    name:
                      type: string
                      maxLength: 253
                    key:
                      type: string
                      maxLength: 253
                    namespace:
                      type: string
                      maxLength: 63
              draDrivers:
                type: array
                description: >-
                  The DRA drivers the cluster's InferenceClasses claim. A
                  device stack installs only for a driver listed here.
                maxItems: 16
                x-kubernetes-list-type: set
                items:
                  type: string
                  minLength: 1
                  maxLength: 253
              nvlinkDisabledPools:
                type: array
                description: >-
                  Node pools whose GPU driver loads with NVLink disabled,
                  because each node's lone GPU has NVLink links with no peer.
                  Every other pool's driver keeps NVLink.
                maxItems: 8
                x-kubernetes-list-type: set
                items:
                  type: string
                  minLength: 1
                  maxLength: 40
          status:
            type: object
