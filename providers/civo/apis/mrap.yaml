# Activates the managed resource kinds every Civo cluster's device stack
# composes, so the provider works with Crossplane installed with an empty
# default activation (provider.defaultActivations=[]).
# compose-provisioned-cluster composes a second policy activating the Civo
# kinds, so the Civo provider runs only once a control plane has a Civo
# cluster. Policies are additive, and their names global, so this one is named
# for its provider.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: modelplane-civo
spec:
  activate:
  - releases.helm.m.crossplane.io
  - objects.kubernetes.m.crossplane.io
