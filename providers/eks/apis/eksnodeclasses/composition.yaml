apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: eksnodeclasses.eks.modelplane.ai
spec:
  compositeTypeRef:
    apiVersion: eks.modelplane.ai/v1alpha1
    kind: EKSNodeClass
  mode: Pipeline
  # Nothing to compose: compose-provisioned-cluster reads it. The step exists
  # because an XR needs a Composition, and with nothing composed it's Ready.
  pipeline:
  - functionRef:
      name: modelplane-modelplane-ekscompose-provisioned-cluster
    step: compose-provisioned-cluster
