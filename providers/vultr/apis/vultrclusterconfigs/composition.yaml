apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: vultrclusterconfigs.vultr.modelplane.ai
spec:
  compositeTypeRef:
    apiVersion: vultr.modelplane.ai/v1alpha1
    kind: VultrClusterConfig
  mode: Pipeline
  # Nothing to compose: compose-provisioned-cluster reads it. The step exists
  # because an XR needs a Composition, and with nothing composed it's Ready.
  pipeline:
  - functionRef:
      name: modelplane-modelplane-vultrcompose-provisioned-cluster
    step: compose-provisioned-cluster
