apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  # Composition names are global, and every provider ships a Composition for
  # a ProvisionedCluster, so this one is named for its provider.
  name: vultr.provisionedclusters.infrastructure.modelplane.ai
  labels:
    # compose-inference-cluster selects this Composition for an
    # InferenceCluster whose spec.cluster.provisioned.configRef is a
    # VultrClusterConfig.
    infrastructure.modelplane.ai/config-group: vultr.modelplane.ai
    infrastructure.modelplane.ai/config-kind: VultrClusterConfig
  annotations:
    # The optional parts of the ProvisionedCluster contract this provider
    # implements. VKE pools can't be restricted to zones, and Vultr has no
    # capacity reservations.
    infrastructure.modelplane.ai/capabilities: ""
    # The DRA drivers whose device stacks the VultrDeviceStack installs.
    infrastructure.modelplane.ai/dra-drivers: gpu.nvidia.com
spec:
  compositeTypeRef:
    apiVersion: infrastructure.modelplane.ai/v1alpha1
    kind: ProvisionedCluster
  mode: Pipeline
  pipeline:
  - functionRef:
      name: modelplane-modelplane-vultrcompose-provisioned-cluster
    step: compose-provisioned-cluster
